{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Network & TTP Analysis{% endblock %}

{% block extra_head %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'dashboard/ttp_radar/shared.css' %}" />
<style>
  /* Minor tweaks to fit your dashboard */
  .shell { width: 100%; max-width: none; padding: 0 12px; }
  .topbar { margin-bottom: 20px; }
  .page-layout { grid-template-columns: 1fr; }
  .sidebar { position: static; width: 100%; margin-bottom: 20px; }
</style>
{% endblock %}

{% block content %}
<!-- PASTE TEAMMATE'S ENTIRE <BODY> CONTENT HERE -->
<!-- Everything between <body> and </body> from their index.html -->
<!-- ... -->
{% endblock %}

{% block extra_js %}
{{ block.super }}
<script src="{% static 'dashboard/ttp_radar/shared-core.js' %}"></script>
<script src="{% static 'dashboard/ttp_radar/ui-base.js' %}"></script>
<script src="{% static 'dashboard/ttp_radar/llm-adjudication.js' %}"></script>
<script src="{% static 'dashboard/ttp_radar/app.js' %}"></script>
<script>
  // Auto-fill Base URL to route through Django proxy
  document.addEventListener('DOMContentLoaded', () => {
    const baseUrlInput = document.getElementById('baseUrl');
    if (baseUrlInput) {
      baseUrlInput.value = '/dashboard/api/ttp-proxy/v1';
    }
  });
</script>
{% endblock %}
