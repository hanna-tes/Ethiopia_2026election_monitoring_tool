<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ethiopia Election Monitor{% endblock %}</title>
    {% load static %}
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <h5 class="mb-0 text-white">
                <i class="fas fa-chart-line me-2"></i>Ethiopia Election Monitor
            </h5>
        </div>
        
        <div class="sidebar-menu">
            <div class="sidebar-item">
                <a href="{% url 'home' %}" class="sidebar-link {% if active_tab == 'home' %}active{% endif %}">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
            </div>
            
            <div class="sidebar-item">
                <a href="{% url 'peps' %}" class="sidebar-link {% if active_tab == 'peps' %}active{% endif %}">
                    <i class="fas fa-user-shield"></i>
                    <span>PEPs/PIPs Tracker</span>
                </a>
            </div>
            
            <div class="sidebar-item">
                <a href="{% url 'lexicons' %}" class="sidebar-link {% if active_tab == 'lexicons' %}active{% endif %}">
                    <i class="fas fa-book"></i>
                    <span>Mapped Lexicons</span>
                </a>
            </div>
            
            <div class="sidebar-item">
                <a href="{% url 'narratives' %}" class="sidebar-link {% if active_tab == 'narratives' %}active{% endif %}">
                    <i class="fas fa-newspaper"></i>
                    <span>Trending Narratives</span>
                </a>
            </div>
            
            <div class="sidebar-item">
                <a href="{% url 'networks' %}" class="sidebar-link {% if active_tab == 'networks' %}active{% endif %}">
                    <i class="fas fa-project-diagram"></i>
                    <span>Networks & TTPs</span>
                </a>
            </div>
            
            <div class="sidebar-item">
                <a href="{% url 'lexicon_management' %}" class="sidebar-link {% if active_tab == 'lexicon_management' %}active{% endif %}">
                    <i class="fas fa-cog"></i>
                    <span>Lexicon Management</span>
                </a>
            </div>
            
            <div class="sidebar-item">
                <a href="{% url 'reports_landing' %}" class="sidebar-link {% if active_tab == 'reports' %}active{% endif %}">
                    <i class="fas fa-file-alt"></i>
                    <span>Reports</span>
                </a>
            </div>
            
            <div class="sidebar-section-title">Data Management</div>
            
            <div class="sidebar-item">
                <a href="{% url 'upload_data' %}" class="sidebar-link {% if active_tab == 'upload' %}active{% endif %}">
                    <i class="fas fa-upload"></i>
                    <span>Upload Data</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
